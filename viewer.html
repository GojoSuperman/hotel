<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>호텔 룸 3D 뷰어</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  #hint {
    position: fixed; left: 12px; bottom: 12px; z-index: 10;
    color: #fff; background: rgba(0,0,0,.55); border-radius: 8px;
    padding: 8px 12px; font: 13px/1.6 system-ui, sans-serif;
  }
</style>
</head>
<body>
<div id="hint">왼쪽 드래그: 회전 · 휠: 확대/축소 · 오른쪽 드래그: 이동</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "@mkkellogg/gaussian-splats3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats3d@0.4.7/build/gaussian-splats-3d.module.min.js"
  }
}
</script>
<script type="module">
import * as GaussianSplats3D from '@mkkellogg/gaussian-splats3d';

// 보여줄 파일: 기본은 같은 폴더의 scene.ply
// 다른 파일을 보려면 주소 뒤에 ?file=파일명 (예: viewer.html?file=instantsplat_room2.ply)
const file = new URLSearchParams(location.search).get('file') || 'scene.ply';

const viewer = new GaussianSplats3D.Viewer({
  cameraUp: [0, -1, 0],              // 장면이 뒤집혀 보이면 [0, 1, 0]으로 변경
  sharedMemoryForWorkers: false      // 특수 서버 설정 없이(로컬/GitHub Pages) 동작하게 함
});

viewer.addSplatScene(file, { showLoadingUI: true, progressiveLoad: true })
  .then(() => viewer.start())
  .catch(err => {
    document.getElementById('hint').textContent =
      `파일을 열지 못했습니다: ${file} — 같은 폴더에 파일이 있는지, 서버로 열었는지 확인하세요. (${err.message})`;
  });
</script>
</body>
</html>
